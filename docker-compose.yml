name: northstar-task

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-taskapp}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/taskapp
      DATABASE_USERNAME: taskapp
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-taskapp}
      LOCAL_COUNTRY: ${LOCAL_COUNTRY:-US}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: taskapp_test
      POSTGRES_USER: taskapp_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp_test -d taskapp_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: ./backend
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://postgres-test:5432/taskapp_test
      TEST_DATABASE_USERNAME: taskapp_test
      TEST_DATABASE_PASSWORD: test-only-password
      TEST_DATABASE_DRIVER: org.postgresql.Driver
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
