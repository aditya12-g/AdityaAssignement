spring:
  application:
    name: task-auth-app
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskapp}
    username: ${DATABASE_USERNAME:taskapp}
    password: ${DATABASE_PASSWORD:taskapp}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
  profiles:
    default: dev

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    allow-public-admin-registration: false
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-deploying-123456}
    expiration: ${JWT_EXPIRATION:PT15M}
  otp:
    expiration: ${OTP_EXPIRATION:PT5M}
    include-in-response: ${OTP_INCLUDE_IN_RESPONSE:true}
  geo:
    provider-url: ${GEO_PROVIDER_URL:https://ipapi.co}
    blocked-countries: ${BLOCKED_COUNTRIES:SY,AF,IR}
    local-country: ${LOCAL_COUNTRY:US}

---
spring:
  config:
    activate:
      on-profile: "!dev"
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}
  auth:
    allow-public-admin-registration: false
    bootstrap-admin:
      email: ${ADMIN_EMAIL}
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
  otp:
    include-in-response: false
  geo:
    local-country: ${LOCAL_COUNTRY:}
